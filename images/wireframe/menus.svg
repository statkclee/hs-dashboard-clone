<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Apple SD Gothic Neo, Pretendard, NanumGothic, sans-serif">
  <title>메뉴별 화면 와이어프레임 요약 — 7개 메뉴</title>
  <rect id="bg" x="0" y="0" width="1200" height="820" fill="#ffffff"/>
  <style>
    .card{fill:#fff;stroke:#bbb}
    .ph{fill:#f4f4f4;stroke:#cfcfcf;stroke-dasharray:4 3}
    .map{fill:#eef3ef;stroke:#cfcfcf;stroke-dasharray:4 3}
    .t{font-size:14px;font-weight:800;fill:#111}
    .b{font-size:10.5px;fill:#a63d2f}
    .s{font-size:10.5px;fill:#888}
    .warn{fill:#fbeeec;stroke:#a63d2f;stroke-dasharray:4 3}
  </style>
  <text x="24" y="30" font-size="17" font-weight="800" fill="#111">메뉴별 화면 — 와이어프레임 요약</text>
  <text x="24" y="48" class="s">각 메뉴는 좌측 하위메뉴 + 지도/표/카드 조합. 붉은 글씨 = 데이터 바인딩(study 9장 판정). 통합돌봄은 개인정보→합성</text>

  <!-- 1 도시현황 -->
  <g transform="translate(24,70)">
    <rect width="372" height="220" class="card"/>
    <text x="14" y="26" class="t">도시현황</text>
    <rect x="14" y="40" width="96" height="160" class="ph"/><text x="22" y="60" class="s">하위메뉴</text>
    <rect x="122" y="40" width="236" height="110" class="ph"/><text x="134" y="98" class="s">인구 피라미드 · 추이 차트</text>
    <rect x="122" y="160" width="112" height="40" class="ph"/><rect x="246" y="160" width="112" height="40" class="ph"/>
    <text x="122" y="214" class="b">인구(행안부) · 고용(KOSIS) · 일자리</text>
  </g>
  <!-- 2 행정현황 -->
  <g transform="translate(414,70)">
    <rect width="372" height="220" class="card"/>
    <text x="14" y="26" class="t">행정현황</text>
    <rect x="14" y="40" width="96" height="160" class="ph"/>
    <rect x="122" y="40" width="236" height="70" class="ph"/><text x="134" y="80" class="s">주요지표 카드</text>
    <rect x="122" y="120" width="236" height="80" class="ph"/><text x="134" y="165" class="s">주민참여예산 표</text>
    <text x="122" y="214" class="b">시정지표(조합) · 수상실적.csv · 참여예산</text>
  </g>
  <!-- 3 사업관리 -->
  <g transform="translate(804,70)">
    <rect width="372" height="220" class="card"/>
    <text x="14" y="26" class="t">사업관리</text>
    <rect x="14" y="40" width="96" height="160" class="ph"/>
    <rect x="122" y="40" width="110" height="90" class="ph"/><text x="130" y="88" class="s">이행률 게이지</text>
    <rect x="244" y="40" width="114" height="90" class="ph"/><text x="254" y="88" class="s">분야별</text>
    <rect x="122" y="140" width="236" height="60" class="ph"/><text x="134" y="174" class="s">공약 목록 표</text>
    <text x="122" y="214" class="b">공약사업-*.csv (다모아 공개값)</text>
  </g>

  <!-- 4 재난/안전 -->
  <g transform="translate(24,310)">
    <rect width="372" height="220" class="card"/>
    <text x="14" y="26" class="t">재난/안전</text>
    <rect x="14" y="40" width="96" height="160" class="ph"/>
    <rect x="122" y="40" width="236" height="120" class="map"/><text x="134" y="104" class="s">대기오염/산사태/급경사지 지도</text>
    <rect x="122" y="168" width="236" height="32" class="ph"/>
    <text x="122" y="214" class="b">에어코리아 · 산사태/붕괴(행안부 API)</text>
  </g>
  <!-- 5 교통 -->
  <g transform="translate(414,310)">
    <rect width="372" height="220" class="card"/>
    <text x="14" y="26" class="t">교통</text>
    <rect x="14" y="40" width="96" height="160" class="ph"/>
    <rect x="122" y="40" width="236" height="120" class="map"/><text x="134" y="104" class="s">충전소·주차장 마커 지도</text>
    <rect x="122" y="168" width="236" height="32" class="ph"/>
    <text x="122" y="214" class="b">전기/수소 충전소 · 공영주차장(좌표 CSV)</text>
  </g>
  <!-- 6 문화/관광 -->
  <g transform="translate(804,310)">
    <rect width="372" height="220" class="card"/>
    <text x="14" y="26" class="t">문화/관광</text>
    <rect x="14" y="40" width="96" height="160" class="ph"/>
    <rect x="122" y="40" width="110" height="90" class="ph"/><text x="130" y="88" class="s">행사 포스터</text>
    <rect x="244" y="40" width="114" height="90" class="map"/><text x="252" y="88" class="s">관광지도</text>
    <rect x="122" y="140" width="236" height="60" class="ph"/><text x="134" y="174" class="s">행사 리스트</text>
    <text x="122" y="214" class="b">행사.csv · 축제 표준데이터 · 관광편의시설</text>
  </g>

  <!-- 7 바로이웃 통합돌봄 (개인정보→합성) -->
  <g transform="translate(24,550)">
    <rect width="762" height="220" class="warn"/>
    <text x="14" y="26" class="t">바로이웃 통합돌봄 — 개인정보, 합성 데이터로 구조만(D4)</text>
    <rect x="14" y="40" width="110" height="160" class="ph"/><text x="22" y="60" class="s">하위메뉴</text>
    <rect x="136" y="40" width="300" height="160" class="map"/><text x="150" y="124" class="s">대상자 분포 지도 (합성)</text>
    <rect x="448" y="40" width="300" height="76" class="ph"/><text x="460" y="82" class="s">서비스 7개 실행현황 (집계)</text>
    <rect x="448" y="124" width="300" height="76" class="ph"/><text x="460" y="166" class="s">복지맵 (공개 시설 + 합성 대상자)</text>
  </g>
  <!-- 범례 -->
  <g transform="translate(804,550)">
    <rect width="372" height="220" class="card"/>
    <text x="14" y="26" class="t">공통 규칙</text>
    <text x="14" y="52" class="s">· 좌측 하위메뉴 + 본문(지도/표/카드)</text>
    <text x="14" y="74" class="s">· 지도: Leaflet + 공개 GeoJSON (NAVER 키 불필요)</text>
    <text x="14" y="96" class="s">· 외부 API: 서버 수집 스냅숏만 읽음 (키 서버에만)</text>
    <text x="14" y="118" class="s">· 반응형(고정 폭 1920 금지 — 원본 결함 R5)</text>
    <text x="14" y="140" class="s">· 기준일 표시(실시간/월/반기/연 혼재)</text>
    <rect x="14" y="156" width="20" height="14" class="warn"/><text x="42" y="168" class="s">개인정보 → 합성</text>
    <rect x="150" y="156" width="20" height="14" class="map"/><text x="178" y="168" class="s">지도</text>
    <rect x="250" y="156" width="20" height="14" class="ph"/><text x="278" y="168" class="s">표/카드</text>
  </g>
</svg>
