<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Apple SD Gothic Neo, Pretendard, NanumGothic, sans-serif" font-size="13" fill="#111">
  <title>급경사지 데이터 비교 — 원본(전수 ~109곳) vs 클론(붕괴위험지역 지정 9곳)</title>
  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>

  <text x="24" y="34" font-weight="700" font-size="17">급경사지 데이터 차이 분석 — 화성시 (2026-11-24 관측)</text>
  <text x="24" y="56" font-size="12.5" fill="#555">같은 '급경사지'지만 <tspan font-weight="700">데이터 범위(scope)가 다르다</tspan> — 원본은 전수, 클론은 '지정된 붕괴위험지역'만.</text>

  <!-- 부분집합 다이어그램 -->
  <circle cx="300" cy="260" r="150" fill="#eaf1fb" stroke="#2c67df" stroke-width="2"/>
  <text x="300" y="150" text-anchor="middle" font-weight="700" fill="#2c67df">원본 대시보드</text>
  <text x="300" y="172" text-anchor="middle" font-size="12" fill="#555">급경사지 전수(관리대상)</text>
  <text x="300" y="206" text-anchor="middle" font-weight="800" font-size="26" fill="#2c67df">~109곳</text>
  <text x="300" y="226" text-anchor="middle" font-size="11" fill="#777">지도 클러스터 합계(7+72+21+9)</text>

  <circle cx="300" cy="320" r="62" fill="#fdecea" stroke="#c23b22" stroke-width="2"/>
  <text x="300" y="312" text-anchor="middle" font-weight="700" fill="#c23b22" font-size="12">클론(현재)</text>
  <text x="300" y="332" text-anchor="middle" font-weight="800" font-size="20" fill="#c23b22">9곳</text>
  <text x="300" y="350" text-anchor="middle" font-size="10.5" fill="#777">붕괴위험지역 지정</text>

  <text x="300" y="438" text-anchor="middle" font-size="12" fill="#555">지정(9) <tspan font-weight="700">⊂</tspan> 전수(109) — 지정은 위험도 평가 후 소수만</text>

  <!-- 비교표 -->
  <g>
    <text x="520" y="150" font-weight="700" font-size="14">항목별 비교</text>
    <line x1="520" y1="162" x2="936" y2="162" stroke="#ccc"/>
    <g font-size="12.5">
      <text x="520" y="186" fill="#888">정의</text>
      <text x="640" y="186">전체 급경사지 관리대상</text>
      <text x="520" y="206" fill="#c23b22">클론:</text><text x="640" y="206">공식 지정 붕괴위험지역(고위험 소수)</text>

      <text x="520" y="238" fill="#888">건수</text>
      <text x="640" y="238" font-weight="700">원본 ~109 · 클론 9 (약 12배 차)</text>

      <text x="520" y="270" fill="#888">데이터원</text>
      <text x="640" y="270">원본: 급경사지 전수 데이터셋(좌표 O)</text>
      <text x="640" y="290" fill="#c23b22">클론: safetydata DSSP-IF-10167(좌표 X)</text>

      <text x="520" y="322" fill="#888">좌표</text>
      <text x="640" y="322">원본 O(지도 점) · <tspan fill="#c23b22">클론 X(표만)</tspan></text>

      <text x="520" y="354" fill="#888">등급</text>
      <text x="640" y="354">클론 9곳 = C 4 · D 4 · A 1 (재해위험도)</text>

      <text x="520" y="386" fill="#888">정확성</text>
      <text x="640" y="386">둘 다 정확 — <tspan font-weight="700">측정 대상이 다름</tspan></text>
    </g>
  </g>

  <!-- 권고 -->
  <rect x="24" y="456" width="912" height="52" rx="8" fill="#fafafa" stroke="#ccc"/>
  <text x="38" y="478" font-weight="700" font-size="12.5">권고</text>
  <text x="38" y="498" font-size="12" fill="#333">① 원본과 동일하게 지도 표시하려면 <tspan font-weight="700">급경사지 전수(좌표 포함) 데이터셋 추가 신청</tspan> · ② 현 9곳은 '붕괴위험지역 지정'으로 라벨 명시(고위험 지표) · ③ 지오코딩으로 9곳 좌표 획득 가능(키 필요)</text>
</svg>
