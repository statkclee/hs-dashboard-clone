<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Apple SD Gothic Neo, Pretendard, NanumGothic, sans-serif">
  <title>인증키 발급·설정 흐름 — 복제 대시보드 (키는 서버에만)</title>
  <rect id="bg" x="0" y="0" width="1000" height="620" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <style>
    .box{fill:#fff;stroke:#111}
    .svr{fill:#f2f5f9;stroke:#273449}
    .warn{fill:#fbeeec;stroke:#a63d2f}
    .t{font-size:13px;font-weight:700;fill:#111}
    .s{font-size:11px;fill:#666}
    .a{font-size:11px;fill:#a63d2f}
  </style>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#111">인증키 발급·설정 흐름</text>
  <text x="40" y="63" class="s">키는 서버 환경변수에만 둔다 — 코드·CSV·커밋·브라우저 어디에도 넣지 않는다 (study 8장)</text>

  <!-- 1 발급 -->
  <rect x="40" y="90" width="270" height="150" class="box"/>
  <text x="56" y="114" class="t">① 발급 (소유 주체 명의 권장)</text>
  <text x="56" y="138" class="s">data.go.kr 가입 → 마이페이지</text>
  <text x="56" y="158" class="s">인증키(serviceKey) 1개 확인</text>
  <text x="56" y="182" class="s">각 API "활용신청"</text>
  <text x="56" y="202" class="a">운영계정 권장 · 일/월 한도 확인</text>
  <text x="56" y="222" class="s">(선택) 경기데이터드림 별도 키</text>

  <!-- 2 설정 -->
  <rect x="365" y="90" width="270" height="150" class="svr"/>
  <text x="381" y="114" class="t">② 서버에 설정</text>
  <text x="381" y="140" class="s" font-family="monospace">export DATA_GO_KR_KEY=…</text>
  <text x="381" y="164" class="s">셸 프로필 / 배포 Secret</text>
  <text x="381" y="188" class="a">저장소에는 넣지 않는다</text>
  <text x="381" y="212" class="s">.gitignore: data/snapshot/</text>

  <!-- 3 수집 -->
  <rect x="690" y="90" width="270" height="150" class="svr"/>
  <text x="706" y="114" class="t">③ 서버 수집</text>
  <text x="706" y="140" class="s" font-family="monospace">python _collect.py</text>
  <text x="706" y="164" class="s">cron 매시 1회</text>
  <text x="706" y="188" class="s">공공 API 호출(서버에서만)</text>
  <text x="706" y="212" class="s">→ data/snapshot/*.json</text>

  <g stroke="#111" stroke-width="1.5" marker-end="url(#ar)">
    <line x1="310" y1="165" x2="363" y2="165"/>
    <line x1="635" y1="165" x2="688" y2="165"/>
  </g>

  <!-- 4 화면 -->
  <rect x="365" y="290" width="270" height="120" class="box"/>
  <text x="381" y="314" class="t">④ 화면 (app.py)</text>
  <text x="381" y="340" class="s">스냅숏만 읽음 — 키 없음</text>
  <text x="381" y="362" class="s">키 있으면 온도 표시</text>
  <text x="381" y="384" class="s">키 없으면 "서버 수집 대기"</text>
  <line x1="800" y1="240" x2="800" y2="350" stroke="#111" stroke-width="1.5"/>
  <line x1="800" y1="350" x2="637" y2="350" stroke="#111" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 브라우저 차단 -->
  <rect x="690" y="290" width="270" height="120" class="warn"/>
  <text x="706" y="314" class="t" fill="#a63d2f">브라우저로 전송 ✗</text>
  <text x="706" y="340" class="s">방문자는 키를 못 본다</text>
  <text x="706" y="362" class="s">호출 수 = 수집 주기(≈24/일)</text>
  <text x="706" y="384" class="a">원본의 노출·429가 사라짐</text>

  <line x1="40" y1="450" x2="960" y2="450" stroke="#cfcfcf"/>
  <text x="40" y="478" class="t">활용신청할 API (복제본)</text>
  <g class="s" font-size="11.5">
    <text x="40" y="500">· 기상청 단기예보(getVilageFcst) — 홈 날씨 · 일/월 한도 확인</text>
    <text x="40" y="520">· 에어코리아 대기오염 15073861 / 측정소 15073877 — 대기</text>
    <text x="40" y="540">· 전기차 충전소 15076352 — 교통</text>
    <text x="520" y="500">· 산사태 15139656 / 붕괴위험 15139701 — 재난/안전</text>
    <text x="520" y="520">· 관세청 수출입 15134344 — 위상</text>
    <text x="520" y="540">· 워크넷 채용 3038225(상업·변경 금지) / 조위 15142507</text>
  </g>
  <text x="40" y="574" class="s">파일(CSV: 인구·주차장·복지시설·철도역 등)은 키가 아니라 포털 다운로드 → data/. 지도는 Leaflet+공개 GeoJSON(네이버 키 불필요).</text>
  <text x="40" y="598" class="a">자세한 절차: docs-apikey.md</text>
</svg>
