# hs-dashboard-clone — 화성특례시 통합 대시보드 복제본 (안전 설계)
#   원본(다모아) 대체. 인증키는 서버에만 — 브라우저로 전송하지 않는다(hs-dashboard-study 8장).
#   렌더 → docs/ = 심볼릭 링크 → ~/builds/nice/hs-dashboard-clone/docs (기기 로컬)
project:
  type: default
  output-dir: docs

lang: ko

format:
  dashboard:
    theme: [default, custom.scss]
    nav-buttons:
      - icon: info-circle
        text: 설계 노트
        href: "https://total.hscity.go.kr"
    expandable: false

execute:
  echo: false
  warning: false
  message: false
